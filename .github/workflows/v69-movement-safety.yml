name: SERVAMAR V69 movement deletion safety
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m py_compile app.py demo_vessels.py demo_movement_correction.py
      - run: node --check static/demo-vessels.js
      - run: python -m unittest discover -s tests -p 'test_v69_*.py' -v
      - run: node tests/v69-movement-deletion-safety.cjs
