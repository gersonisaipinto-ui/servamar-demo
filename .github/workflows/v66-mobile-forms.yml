name: SERVAMAR V66 mobile forms
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  mobile-forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check static/app.js
      - run: node --check static/demo-vessels.js
      - run: node tests/v63-ui-validation.cjs
      - run: node tests/v64-mobile-cards.cjs
      - run: node tests/v65-mobile-alerts.cjs
      - run: node tests/v66-mobile-forms.cjs
