name: SERVAMAR V62 movement replay
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  movement-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "Flask>=3,<4"
      - run: python -m py_compile demo_vessels.py demo_movement_replay.py tests/test_v62_movement_replay.py
      - run: python -m unittest discover -s tests -p 'test_v62_movement_replay.py' -v
