name: SERVAMAR V62 movement replay and PostgreSQL integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  movement-replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: servamar_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: servamar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servamar_test -d servamar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERVAMAR_TEST_POSTGRES_URL: postgresql://servamar_test:local_test_only@localhost:5432/servamar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "Flask>=3,<4" "psycopg[binary]>=3,<4"
      - run: python -m py_compile demo_vessels.py demo_movement_replay.py demo_movement_correction.py tests/test_v62_movement_replay.py tests/test_v62_movement_correction.py tests/test_v62_postgres_integration.py
      - run: python -m unittest discover -s tests -p 'test_v62_*.py' -v
