name: SERVAMAR V74 PostgreSQL sandbox
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile operational_pg_sandbox.py
      - run: python -m unittest discover -s tests -p 'test_v74_*.py' -v
