name: SERVAMAR V72 operational backup safety
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile operational_backup.py tests/test_v72_operational_backup.py
      - run: python -m unittest discover -s tests -p 'test_v72_*.py' -v
