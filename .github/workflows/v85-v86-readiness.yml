name: SERVAMAR V85 V86 recovery readiness
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile operational_cutover_readiness.py operational_backup_retention.py
      - run: python -m unittest discover -s tests -p 'test_v85_v86_*.py' -v
