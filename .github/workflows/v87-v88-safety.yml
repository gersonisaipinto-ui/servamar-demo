name: SERVAMAR V87 V88 safe projection
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile operational_safe_projection.py operational_restore_inspector.py
      - run: python -m unittest discover -s tests -p 'test_v87_v88_*.py' -v
