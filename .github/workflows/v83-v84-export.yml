name: SERVAMAR V83 V84 export readiness
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile operational_staging_readiness.py operational_portable_verifier.py
      - run: python -m unittest discover -s tests -p 'test_v83_v84_*.py' -v
