name: SERVAMAR - verificar código
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'push_demo.py'
      - 'requirements.txt'
      - 'static/push-demo.js'
      - 'templates/index.html'
      - 'tests/**'
      - '.github/workflows/servamar-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxis de Python sin acceder a secretos ni datos reales
        run: python -m py_compile app.py push_demo.py
      - name: Verificar sintaxis de JavaScript
        run: node --check static/push-demo.js
      - name: Instalar dependencias para pruebas locales ficticias
        run: python -m pip install -r requirements.txt
      - name: Verificar reglas de recordatorios (sin datos reales)
        env:
          SERVAMAR_DEMO_MODE: 'YES'
          SERVAMAR_CLOUD_MODE: 'NO'
          SERVAMAR_PUSH_DATABASE_URL: ''
        run: python -m unittest discover -s tests -p 'test_*.py' -v
